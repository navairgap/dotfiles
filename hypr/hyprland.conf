# navairgap — Nothing OS on Hyprland
# core config. keybinds/execs/rules live in their own files.

source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/execs.conf
source = ~/.config/hypr/windowrules.conf

monitor=,preferred,auto,1

env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $red
    col.inactive_border = $surface
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    drop_shadow = false

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = nothing, 0.22, 0.9, 0.24, 1
    animation = windows, 1, 4, nothing, slide
    animation = border, 1, 3, nothing
    animation = fade, 1, 3, nothing
    animation = workspaces, 1, 4, nothing, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}
