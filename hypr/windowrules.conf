# nothing rules — float the small things, leave the rest alone

windowrulev2 = float, class:^(thunar)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = center, class:^(thunar)$
windowrulev2 = size 60% 70%, class:^(thunar)$

windowrulev2 = opacity 0.95 0.85, class:^(kitty)$

# no gaps when only one window — the nothing way
workspace = w[tv1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]

# picture-in-picture stays on top, no borders — the nothing way to watch while you work
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = noborder, title:^(Picture-in-Picture)$
