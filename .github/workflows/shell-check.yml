name: Shell checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh
          bash -n waybar/*.sh
      - name: Check patch whitespace
        run: git diff --check
