name: Shell checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh
          sh -n rice/rice
      - name: Check patch whitespace
        run: git diff --check

      - name: Exercise installer in an isolated home
        run: bash tests/install-smoke.sh
