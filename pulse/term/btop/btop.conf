#? btop v.1.4.6 dump — btop writes this file back on exit, so the notes below are for me, not for it

#* a btop++/bpytop/bashtop ".theme" file from ~/.config/btop/themes ("Default" and "TTY" are the builtins)
color_theme = "pulse"

#* let the theme paint its background; false keeps the terminal's own transparency
theme_background = false

#* 24-bit color; false downgrades everything to the 256-color cube (6x6x6)
truecolor = true

#* force tty mode even when a real terminal is detected: 16 colors, tty theme, tty graph symbols
force_tty = false

#* box layout presets. "box_name:P:G" — P is the alternate position (0 or 1), G the graph symbol;
#* whitespace between presets. preset 0 is always every box with defaults.
#* example: "cpu:0:default,mem:0:tty,proc:1:default cpu:0:braille,proc:0:tty"
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"

#* h,j,k,l,g,G for moving around the lists; shift+h and shift+k stay help and kill
vim_keys = false

#* rounded box corners, ignored in tty mode
rounded_corners = true

#* terminal synchronized output sequences, where supported — less flicker
terminal_sync = true

#* default graph symbols. "braille" is the finest but not every font carries it, "block" is coarser with more
#* common glyphs, "tty" is three symbols that work anywhere — and only half the horizontal resolution, so a
#* shorter history
graph_symbol = "braille"

#* graph symbol for the cpu box: "default", "braille", "block" or "tty"
graph_symbol_cpu = "default"

#* same for the gpu box
graph_symbol_gpu = "default"

#* same for the mem box
graph_symbol_mem = "default"

#* same for the net box
graph_symbol_net = "default"

#* same for the proc box
graph_symbol_proc = "default"

#* which boxes to show: "cpu mem net proc" and "gpu0" through "gpu5", whitespace separated
shown_boxes = "cpu mem net proc"

#* refresh in ms; 2000 and up gives the graphs cleaner samples
update_ms = 2000

#* process sorting: "cpu lazy" follows the top process over time (easier to read), "cpu direct" jumps the moment
#* the top process changes
proc_sorting = "cpu lazy"

#* reverse the sort
proc_reversed = false

#* processes as a tree
proc_tree = false

#* paint the process list with the cpu graph colors
proc_colors = true

#* darken the process list with a gradient
proc_gradient = true

#* cpu of the core the process runs on, instead of the total
proc_per_core = false

#* process memory in bytes, not percent
proc_mem_bytes = true

#* a cpu graph per process
proc_cpu_graphs = true

#* memory from /proc/[pid]/smaps in the process info box — very slow, but exact
proc_info_smaps = false

#* proc box on the left instead of the right
proc_left = false

#* (linux) hide processes tied to the kernel, htop-style
proc_filter_kernel = false

#* in tree view, fold child process resources into the parent
proc_aggregate = false

#* keep dead processes' cpu and mem on screen while paused
keep_dead_proc_usage = false

#* the stat in the upper half of the cpu graph; "total" is always there, the rest depends on the machine —
#* pick from the options menu
cpu_graph_upper = "Auto"

#* same for the lower half
cpu_graph_lower = "Auto"

#* gpu info in the cpu box: "Auto", "On" or "Off"
show_gpu_info = "Auto"

#* flip the lower cpu graph
cpu_invert_lower = true

#* true does away with the lower cpu graph entirely
cpu_single_graph = false

#* cpu box at the bottom instead of the top
cpu_bottom = false

#* uptime in the cpu box
show_uptime = true

#* cpu package power draw in watts; needs `make setcap` or `make setuid`, or running under sudo
show_cpu_watts = true

#* cpu temperature
check_temp = true

#* which sensor to trust; the options menu lists what's detected
cpu_sensor = "Auto"

#* per-core temps too, when check_temp is on and sensors were found
show_coretemp = true

#* when a core reports the wrong sensor's temp, map it by hand: "wrong:right" pairs, space separated
#* ("4:0 5:1 6:3"). lm-sensors or similar tells me who reports what
cpu_core_map = ""

#* "celsius", "fahrenheit", "kelvin" or "rankine"
temp_scale = "celsius"

#* sizes in base 10: KB = 1000 instead of KiB = 1024
base_10_sizes = false

#* cpu frequency
show_cpu_freq = true

#* how to read it: "first", "range", "lowest", "highest" or "average"
freq_mode = "first"

#* clock at the top, strftime format, empty string turns it off.
#* /host, /user and /uptime get substituted
clock_format = "%X"

#* keep redrawing behind the menus; false if the flicker gets too annoying
background_update = true

#* rename the cpu model; empty string keeps the real one
custom_cpu_name = ""

#* show only these mountpoints (full paths, whitespace separated); prepend exclude= to show everything but them.
#* examples: disk_filter="/boot /home/user", disks_filter="exclude=/boot /home/user"
disks_filter = ""

#* graphs instead of meters for memory
mem_graphs = true

#* mem box under net instead of above
mem_below_net = false

#* count zfs arc in cached and available
zfs_arc_cached = true

#* swap in the memory box
show_swap = true

#* swap as its own disk — ignores show_swap, parks itself after the first disk
swap_disk = true

#* split the mem box to show disks too
show_disks = true

#* drop non-physical disks; false keeps network disks, ram disks and friends
only_physical = true

#* disk list from /etc/fstab — this turns only_physical off
use_fstab = true

#* true hides all datasets and shows only zfs pools (io stats calculated per pool)
zfs_hide_datasets = false

#* free space as privileged users see it
disk_free_priv = false

#* disk busy time % in the regular disk view
show_io_stat = true

#* io mode: big read/write graphs per disk
io_mode = false

#* one combined read/write graph in io mode
io_graph_combined = false

#* graph top per disk in MiB/s (100 by default), "mountpoint:speed", whitespace separated.
#* example: "/mnt/media:100 /:20 /boot:1"
io_graph_speeds = ""

#* fixed net graph tops in mebibits; only used while net_auto is false
net_download = 100

net_upload = 100

#* auto-rescaling net graphs, down to 10 KiB at the lowest; ignores the fixed tops above
net_auto = true

#* download and upload share whichever of the two scales is higher
net_sync = true

#* start on this interface
net_iface = ""

#* "True" — bitrates in base 10 (Kbps, Mbps); "False" — binary (Kibps, Mibps); "Auto" follows base_10_sizes
base_10_bitrate = "Auto"

#* battery top right, when the machine has one
show_battery = true

#* which battery, when there are several; "Auto" picks
selected_battery = "Auto"

#* battery power draw next to the charge indicator
show_battery_watts = true

#* log level for "~/.local/state/btop.log": "ERROR" "WARNING" "INFO" "DEBUG" —
#* each level includes everything below it
log_level = "WARNING"

#* write settings back into this file on exit
save_config_on_exit = true

#* pcie throughput on nvidia; can cost performance on some cards
nvml_measure_pcie_speeds = true

#* same, on amd
rsmi_measure_pcie_speeds = true

#* mirror the gpu graph horizontally
gpu_mirror_graph = true

#* vendors to show: "nvidia amd intel"
shown_gpus = "nvidia amd intel"

#* rename gpu0; empty string keeps the real one
custom_gpu_name0 = ""

#* rename gpu1; empty string keeps the real one
custom_gpu_name1 = ""

#* rename gpu2; empty string keeps the real one
custom_gpu_name2 = ""

#* rename gpu3; empty string keeps the real one
custom_gpu_name3 = ""

#* rename gpu4; empty string keeps the real one
custom_gpu_name4 = ""

#* rename gpu5; empty string keeps the real one
custom_gpu_name5 = ""
